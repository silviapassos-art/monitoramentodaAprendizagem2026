const cap = s => s.toLowerCase().replace(/(^|[\s-])(\p{L})/gu, (_, sep, c) => sep + c.toUpperCase());
const rotuloReg = s => cap(s) + (s === 'SÃO FRANCISCO XAVIER' ? ' (distrito)' : '');
const plEsc = n => n + (n === 1 ? ' escola' : ' escolas');

const fluPor = {};
fluencia.escolas.forEach(e => { fluPor[e.n] = e; });

const dados = matEsc.map(e => {
  const f = fluPor[e.n] || {}, g = geo[e.n] || {};
  return {
    n: e.n, r: g.r || '—', lat: g.lat, lon: g.lon, end: g.end || '',
    mat: { ind: e.mi + e.ex, a: e.a, c: e.c, f: [e.pa, e.mi, e.ex] },
    flu: { ind: (f.ini || 0) + (f.flu || 0), a: f.a, c: f.c, f: [f.pre, f.ini, f.flu] }
  };
}).filter(e => e.lat != null);

const CFG = {
  mat: { ind: 'Alunos no mínimo ou acima', faixas: ['Parcialmente', 'No mínimo', 'Excedeu'] },
  flu: { ind: 'Leitores iniciantes ou fluentes', faixas: ['Pré-leitor', 'Iniciante', 'Fluente'] }
};

let aval = 'mat', visao = 'regiao', regiao = 'todas';

/* ---------- geometria: áreas de proximidade (Thiessen) ---------- */
const RAIO_KM = 6;
const mediana = a => { const s = a.slice().sort((x, y) => x - y); return s[Math.floor(s.length / 2)]; };
const centro = [mediana(dados.map(e => e.lat)), mediana(dados.map(e => e.lon))];
const perto = e => Math.abs(e.lat - centro[0]) < 0.15 && Math.abs(e.lon - centro[1]) < 0.15;
const urbanas = dados.filter(perto);
const distantes = dados.filter(e => !perto(e));
// Estrutura oficial da rede: as 6 regiões urbanas mais o distrito de São Francisco Xavier.
distantes.forEach(e => { e.r = 'SÃO FRANCISCO XAVIER'; });

const ry = RAIO_KM / 111, rx = RAIO_KM / (111 * Math.cos(centro[0] * Math.PI / 180));
const elipse = (cx, cy, n) => d3.range(n).map(i => {
  const t = (i / n) * 2 * Math.PI;
  return [cx + rx * Math.cos(t), cy + ry * Math.sin(t)];
});

function corta(sujeito, cortador) {
  let saida = sujeito;
  for (let i = 0; i < cortador.length && saida.length; i++) {
    const A = cortador[i], B = cortador[(i + 1) % cortador.length];
    const dentro = p => (B[0] - A[0]) * (p[1] - A[1]) - (B[1] - A[1]) * (p[0] - A[0]) >= 0;
    const ent = saida; saida = [];
    for (let j = 0; j < ent.length; j++) {
      const P = ent[j], Q = ent[(j + 1) % ent.length];
      const dp = dentro(P), dq = dentro(Q);
      if (dp) saida.push(P);
      if (dp !== dq) {
        const a1 = Q[1] - P[1], b1 = P[0] - Q[0], c1 = a1 * P[0] + b1 * P[1];
        const a2 = B[1] - A[1], b2 = A[0] - B[0], c2 = a2 * A[0] + b2 * A[1];
        const det = a1 * b2 - a2 * b1;
        if (det) saida.push([(c1 * b2 - c2 * b1) / det, (a1 * c2 - a2 * c1) / det]);
      }
    }
  }
  return saida;
}

const xs = urbanas.map(e => e.lon), ys = urbanas.map(e => e.lat);
const caixa = [Math.min(...xs) - 0.1, Math.min(...ys) - 0.1, Math.max(...xs) + 0.1, Math.max(...ys) + 0.1];
const vor = d3.Delaunay.from(urbanas, e => e.lon, e => e.lat).voronoi(caixa);
urbanas.forEach((e, i) => {
  const cel = vor.cellPolygon(i);
  e.poly = cel ? corta(cel.slice(0, -1), elipse(e.lon, e.lat, 40)).map(p => [p[1], p[0]]) : null;
});
distantes.forEach(e => { e.poly = elipse(e.lon, e.lat, 40).map(p => [p[1], p[0]]); });

/* ---------- mapa ---------- */
const map = L.map('map', { scrollWheelZoom: true });
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors', maxZoom: 18, opacity: 0.85
}).addTo(map);
const areas = L.layerGroup().addTo(map);
map.createPane('mascara');
map.getPane('mascara').style.zIndex = 450;
map.getPane('mascara').style.pointerEvents = 'none';
const mascara = L.layerGroup().addTo(map);
const pontos = L.layerGroup().addTo(map);

// Recorta o coroplético no perímetro urbano oficial (GeoSanja): polígono do mundo com o perímetro como buraco.
L.polygon([[[-10, -80], [-40, -80], [-40, -20], [-10, -20]]].concat(perimetro), {
  stroke: false, fillColor: '#f7f6f3', fillOpacity: 1, interactive: false, pane: 'mascara'
}).addTo(mascara);
perimetro.forEach(r => L.polyline(r, { color: '#57544e', weight: 1.2, opacity: 0.75, interactive: false, pane: 'mascara' }).addTo(mascara));

function enquadrar(lista, tudo) {
  const alvo = tudo ? lista : (lista.filter(perto).length ? lista.filter(perto) : lista);
  if (alvo.length) map.fitBounds(alvo.map(e => [e.lat, e.lon]), { padding: [40, 40], maxZoom: 14 });
}
enquadrar(dados, false);

function agregados() {
  const g = {};
  dados.forEach(e => {
    const o = g[e.r] || (g[e.r] = { escolas: 0, aval: 0, soma: 0 });
    o.escolas++; o.aval += (e[aval].a || 0); o.soma += (e[aval].a || 0) * e[aval].ind;
  });
  Object.values(g).forEach(o => o.ind = o.aval ? Math.round(o.soma / o.aval) : 0);
  return g;
}

function popupEscola(e) {
  const m = e[aval];
  return '<b>' + e.n + '</b><br><span style="color:#8a867e">' + rotuloReg(e.r) + '</span><br>' +
    (e.end ? '<span style="color:#8a867e;font-size:12px">' + e.end + '</span><br>' : '') +
    '<div style="margin-top:8px">' + CFG[aval].ind + ': <b class="mono">' + m.ind + '%</b></div>' +
    '<div style="color:#57544e">' + nf(m.a) + ' avaliados · participação ' + (m.c || 0) + '%</div>' +
    '<div style="margin-top:6px;color:#57544e;font-size:12px">' +
      CFG[aval].faixas.map((f, i) => f + ' ' + (m.f[i] || 0) + '%').join(' · ') + '</div>';
}

function desenhar() {
  areas.clearLayers(); pontos.clearLayers();
  const ag = agregados();
  const vis = dados.filter(e => regiao === 'todas' || e.r === regiao);

  if (visao !== 'ponto') {
    vis.forEach(e => {
      if (!e.poly || e.poly.length < 3) return;
      const porRegiao = visao === 'regiao';
      const v = porRegiao ? ag[e.r].ind : e[aval].ind;
      const c = cor(v);
      L.polygon(e.poly, porRegiao
        ? { stroke: false, fillColor: c, fillOpacity: 0.72 }
        : { color: '#ffffff', weight: 1.2, opacity: 0.9, fillColor: c, fillOpacity: 0.72 }
      ).bindTooltip(porRegiao ? rotuloReg(e.r) + ' — ' + v + '%' : e.n + ' — ' + v + '%', { direction: 'top' })
        .bindPopup(porRegiao
          ? '<b>' + rotuloReg(e.r) + '</b><div style="margin-top:6px">' + CFG[aval].ind + ': <b class="mono">' + ag[e.r].ind + '%</b></div>' +
            '<div style="color:#57544e">' + plEsc(ag[e.r].escolas) + ' · ' + nf(ag[e.r].aval) + ' alunos avaliados</div>' +
            '<div style="margin-top:6px;color:#8a867e;font-size:12px">Área de proximidade de ' + e.n + '</div>'
          : popupEscola(e))
        .addTo(areas);
    });
  }

  vis.forEach(e => {
    L.circleMarker([e.lat, e.lon], {
      radius: visao === 'ponto' ? 6 + Math.sqrt(e[aval].a || 1) / 1.7 : 2.5,
      fillColor: visao === 'ponto' ? cor(e[aval].ind) : '#191817',
      color: '#ffffff', weight: visao === 'ponto' ? 1.5 : 1, opacity: 1, fillOpacity: 0.95
    }).bindTooltip(e.n + ' — ' + e[aval].ind + '%', { direction: 'top' })
      .bindPopup(popupEscola(e)).addTo(pontos);
  });

  document.getElementById('mapfoot').textContent = visao === 'ponto'
    ? 'O tamanho do círculo é proporcional ao número de alunos avaliados. Exibindo ' + vis.length + ' de ' + dados.length + ' escolas.'
    : 'Cada área é a região do território mais próxima daquela escola (polígonos de Thiessen), recortada no perímetro urbano oficial. Exibindo ' + vis.length + ' de ' + dados.length + ' escolas.';
}

function legenda() {
  document.getElementById('legend').innerHTML =
    '<span style="color:#8a867e">' + CFG[aval].ind + '</span>' +
    ESCALA.map(e => '<span><span class="swatch" style="background:' + e.cor + '"></span>' + e.nome + '</span>').join('');
}

function chipsRegiao() {
  const box = document.getElementById('regioes');
  const lista = ['todas'].concat([...new Set(dados.map(e => e.r))].sort());
  box.innerHTML = lista.map(r => '<button data-r="' + r + '" aria-pressed="' + (r === regiao) + '">' +
    (r === 'todas' ? 'Todas' : rotuloReg(r)) + '</button>').join('');
  box.querySelectorAll('button').forEach(b => b.onclick = () => selecionar(b.dataset.r));
}

function selecionar(r) {
  regiao = (regiao === r && r !== 'todas') ? 'todas' : r;
  enquadrar(regiao === 'todas' ? dados : dados.filter(e => e.r === regiao), regiao !== 'todas');
  chipsRegiao(); desenhar(); painel();
}

function painel() {
  const ag = agregados();
  const linhas = Object.entries(ag).map(([r, g]) => ({ r: r, ...g })).sort((a, b) => b.ind - a.ind);
  document.getElementById('regfoot').textContent = CFG[aval].ind + ', média ponderada pelo nº de alunos de cada escola. Clique para focar no mapa.';
  document.getElementById('reglist').innerHTML = linhas.map(l =>
    '<div class="reg" data-r="' + l.r + '" style="' + (l.r === regiao ? 'background:#faf9f7' : '') + '">' +
      '<div><div style="display:flex;align-items:center;gap:7px">' +
        '<span class="swatch" style="background:' + cor(l.ind) + '"></span>' +
        '<span style="font-size:13.5px">' + rotuloReg(l.r) + '</span>' +
        '<span style="font-size:11.5px;color:#8a867e">' + plEsc(l.escolas) + ' · ' + nf(l.aval) + ' alunos</span>' +
      '</div><div class="bar"><div style="width:' + l.ind + '%;height:100%;background:' + cor(l.ind) + ';border-radius:999px"></div></div></div>' +
      '<div class="mono" style="text-align:right;font-size:14px">' + l.ind + '%</div>' +
    '</div>').join('');
  document.querySelectorAll('#reglist .reg').forEach(el => el.onclick = () => selecionar(el.dataset.r));
}

document.querySelectorAll('#aval button').forEach(b => b.onclick = () => {
  aval = b.dataset.k;
  document.querySelectorAll('#aval button').forEach(x => x.setAttribute('aria-selected', String(x === b)));
  legenda(); desenhar(); painel();
});
document.querySelectorAll('#visao button').forEach(b => b.onclick = () => {
  visao = b.dataset.k;
  document.querySelectorAll('#visao button').forEach(x => x.setAttribute('aria-selected', String(x === b)));
  desenhar();
});
document.getElementById('verTudo').onclick = () => enquadrar(dados, true);

document.getElementById('notas').innerHTML =
  '<b style="font-weight:500;color:#57544e">Como o coroplético foi construído.</b> ' +
  'A rede não tem limites geográficos publicados para as regiões administrativas, então as áreas não foram desenhadas à mão: ' +
  'cada polígono é a <b style="font-weight:500">área de proximidade</b> da escola — o trecho do território mais perto dela do que de qualquer outra escola da rede ' +
  '(polígonos de Thiessen/Voronoi calculados a partir das coordenadas reais), recortado no <b style="font-weight:500">perímetro urbano oficial</b> do município (GeoSanja, reprojetado de EPSG:31983 para WGS84). ' +
  'Em "Por região", todas as áreas da mesma região recebem a cor do indicador regional (média ponderada pelos alunos avaliados) e se fundem visualmente; ' +
  'em "Por escola", cada área recebe a cor da própria escola. ' +
  'Se a Secretaria tiver o GeoJSON/shapefile dos limites das regiões ou dos bairros, trocamos os polígonos pelos oficiais sem mudar o resto da página. ' +
  'Coordenadas e regiões: planilha de endereços da rede. Perímetro urbano: GeoSanja / Prefeitura de São José dos Campos. Malha e imagens © OpenStreetMap contributors.';

legenda(); chipsRegiao(); desenhar(); painel();
</script>
</body>
</html>
